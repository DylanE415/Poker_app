<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Poker — Table</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" href="/static/favicon.png" type="image/png" />
  <link rel="stylesheet" href="/static/table.css" />
</head>
<body>
  <header>
    <div class="row">
      <strong>Poker Table</strong>
      <span id="status" class="pill muted">disconnected</span>
    </div>
    <div class="row">
      <span id="who" class="muted"></span>
      <button id="logoutBtn" title="Log out">Log out</button>
    </div>
  </header>

  <main class="layout">
    <section class="control-rail">
      <div class="control-item">
        <span class="control-label">Room</span>
        <select id="room" class="control-input">
          <option value="1">0.25/0.50 NL Hold'em</option>
        </select>
      </div>
      <div class="control-item">
        <span class="control-label">Buy In(20-50)</span>
        <input id="stack" type="number" step="1" min="0" value="40" class="control-input" />
      </div>
      <div class="control-actions">
        <button id="joinBtn" type="button">Join</button>
        <button id="leaveBtn" type="button">Leave</button>
        <button id="sitInBtn" type="button" title="Sit in">Sit In</button>
        <button id="sitOutBtn" type="button" title="Sit out">Sit Out</button>
        <button id="ledgerBtn" type="button" title="View ledger">Ledger</button>
      </div>
    </section>

    <section class="table-wrap">
      <div class="felt" aria-hidden="true"></div>

      <div id="showdownBanner" class="showdown" style="display:none"></div>
      <div id="actionMsg" class="actionmsg" style="display:none"></div>
      <div id="showdownList" class="showdown-list" style="display:none"></div>

      <div class="hud">
        <div>• <img class="chip" src="/static/chips/chips.png" alt="" /> Pot: <span id="pot">—</span></div>
      </div>

      <div id="board" class="board"></div>
      <div id="seatsLayer"></div>
      <div id="betsLayer"></div>

      <audio id="chipSound"  src="/static/sounds/poker_chip_drop.mp3" preload="auto"></audio>
      <audio id="checkSound" src="/static/sounds/check.mp3" preload="auto"></audio>
      <audio id="audio67"    src="/static/sounds/67.mp3" preload="auto"></audio>
      <audio id="dealSound"  src="/static/sounds/deal_card.mp3" preload="auto"></audio>
    </section>

    <section class="myhand">
      <div class="emote-panel">
        <button id="emoteBtn" type="button" aria-haspopup="menu" aria-expanded="false" title="Send an emote">Emote</button>
        <div id="emoteMenu" class="emote-menu" role="menu" aria-label="Emotes"></div>
        <div id="emoteCooldown" class="emote-cooldown" aria-live="polite"></div>
        <div id="timebankDisplay" class="timebank-display"></div>
        <div style="display:flex; gap:.4rem; margin-top:.15rem;">
          <button id="showHandBtn" type="button" title="Show your hand to the table">Show Hand</button>
          <button id="hideHandBtn" type="button" title="Hide your hand from the table">Hide Hand</button>
        </div>
      </div>

      <div class="cards" id="myHand"></div>

      <div class="controls-right">
        <div class="sliderRow">
          <input id="raiseSlider" type="range" min="0" max="100" step="1" value="0" />
          <div class="amountBoxWrap">
            <input id="raiseAmt" class="amountBox" type="number" step="0.25" min="0" value="0" />
            <div class="spinnerButtons">
              <button type="button" id="raiseUp" class="spinBtn">▲</button>
              <button type="button" id="raiseDown" class="spinBtn">▼</button>
            </div>
          </div>
        </div>

        <div class="btnRow">
          <button id="foldBtn" type="button" class="btnFold">Fold</button>
          <button id="callBtn" type="button" class="btnCall">Call <span id="callAmt">0.00</span></button>
          <button id="raiseBtn" type="button" class="btnRaise">Raise to <span id="raiseAmtLabel">0.00</span></button>
        </div>

        <div class="btnRow single">
          <button id="checkBtn" type="button" class="btnBig">Check</button>
        </div>

        <div class="btnRow">
          <button id="clearBtn" type="button" title="Clear your queued action">Clear</button>
          <span id="queuedLabel" class="queued" style="align-self:center;">Queued: <strong id="queuedValue">—</strong></span>
        </div>

        <div id="serverMsg" class="server-message"></div>
      </div>
    </section>
  </main>

  <script src="/static/table.js"></script>
</body>
</html>
