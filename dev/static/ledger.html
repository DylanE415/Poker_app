<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Ledger</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root { --bg:#0b1020; --panel:#121a33; --muted:#aab3cc; --good:#3ecf8e; --bad:#f25f5c; --line:#1f2a4d; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background: var(--bg); color: #e9efff; }
    .wrap { max-width: 820px; margin: 2rem auto; padding: 0 1rem; }
    h1 { margin: 0 0 0.25rem; font-size: 1.6rem; }
    p.muted { margin: 0 0 1rem; color: var(--muted); }
    .pill { display:inline-block; padding:.2rem .55rem; border:1px solid var(--line); border-radius:999px; color:#cfe0ff; font-size:.85rem; margin-left:.6rem; }
    .controls { display:flex; gap:.6rem; align-items:center; margin:.6rem 0 0; }
    button { font:inherit; padding:.48rem .7rem; border-radius:10px; border:1px solid var(--line); background:#0e1530; color:#e9efff; cursor:pointer; }
    button:hover { filter: brightness(1.06); }
    table { width:100%; border-collapse: collapse; background: var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; margin-top:.25rem; }
    th, td { padding:.7rem .8rem; border-bottom:1px solid var(--line); text-align:left; }
    th { color: var(--muted); font-weight:600; }
    tr:last-child td { border-bottom: none; }
    td.right { text-align:right; }
    .pos { color: var(--good); }
    .neg { color: var(--bad); }
    .tot { font-weight:700; }
    .error { margin-top: .75rem; color: var(--bad); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>
      Table Ledger
      <span id="updated" class="pill">loading…</span>
    </h1>
    <p class="muted">Positive = up; negative = down. Source: <code>/static/ledger.json</code>.</p>

    <div class="controls">
      <button id="refreshBtn" type="button">Refresh</button>
    </div>

    <table aria-label="ledger">
      <thead>
        <tr><th>Player</th><th class="right">Net</th></tr>
      </thead>
      <tbody id="rows">
        <tr><td colspan="2" class="muted">Loading…</td></tr>
      </tbody>
      <tfoot>
        <tr><td class="tot">Total</td><td id="totalCell" class="tot right">—</td></tr>
      </tfoot>
    </table>

    <div id="err" class="error" role="alert" style="display:none;"></div>
  </div>

  <script>
    // 🔧 Absolute path so it works when the page is served at /ledger
    const LEDGER_URL = '/static/ledger.json';

    function dollars(v) {
      const n = Number(v);
      if (!Number.isFinite(n)) return '—';
      const sign = n >= 0 ? '+' : '';
      return sign + n.toFixed(2);
    }

    async function render() {
      const rowsEl = document.getElementById('rows');
      const totalEl = document.getElementById('totalCell');
      const updEl = document.getElementById('updated');
      const errEl = document.getElementById('err');

      rowsEl.innerHTML = '<tr><td colspan="2" class="muted">Loading…</td></tr>';
      errEl.style.display = 'none'; errEl.textContent = '';

      try {
        const res = await fetch(LEDGER_URL + '?v=' + Date.now(), { credentials: 'include' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();

        // Expecting: { "ledger": [ { id, name, net_profit }, ... ] }
        const items = Array.isArray(data?.ledger) ? data.ledger.slice() : [];
        items.sort((a,b) => (Number(b.net_profit)||0) - (Number(a.net_profit)||0));

        let total = 0;
        rowsEl.innerHTML = '';
        for (const it of items) {
          const name = String(it.name || it.id || 'player');
          const net = Number(it.net_profit) || 0;
          total += net;

          const tr = document.createElement('tr');
          const tdName = document.createElement('td'); tdName.textContent = name;
          const tdNet  = document.createElement('td'); tdNet.className = 'right ' + (net >= 0 ? 'pos' : 'neg'); tdNet.textContent = dollars(net);
          tr.appendChild(tdName); tr.appendChild(tdNet);
          rowsEl.appendChild(tr);
        }

        totalEl.textContent = dollars(total);
        totalEl.className = 'tot right ' + (total >= 0 ? 'pos' : 'neg');
        updEl.textContent = 'updated ' + new Date().toLocaleString();
      } catch (e) {
        rowsEl.innerHTML = '<tr><td colspan="2" class="muted">No data</td></tr>';
        totalEl.textContent = '—'; totalEl.className = 'tot right';
        updEl.textContent = 'error';
        errEl.textContent = 'Failed to load ledger.json: ' + e.message;
        errEl.style.display = 'block';
      }
    }

    document.getElementById('refreshBtn').addEventListener('click', render);
    render();
  </script>
</body>
</html>
