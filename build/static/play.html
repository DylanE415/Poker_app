<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Poker — Table</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root { --bg:#0b1020; --panel:#121a33; --muted:#aab3cc; --accent:#4da3ff; --bad:#f25f5c; --good:#3ecf8e; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: #e9efff; }
    header { display:flex; align-items:center; justify-content:space-between; padding:1rem 1.25rem; border-bottom: 1px solid #1f2a4d; }
    .row { display:flex; gap:1rem; align-items:center; flex-wrap:wrap; }
    .card { background: var(--panel); border:1px solid #1f2a4d; border-radius:14px; padding:1rem; }
    label { font-size:.9rem; color: var(--muted); }
    select, input, button { font: inherit; padding:.55rem .7rem; border-radius:10px; border:1px solid #243158; background:#0e1530; color:#e9efff; }
    button { background:#13214a; cursor:pointer; border-color:#2b3b71; transition: filter .15s ease, opacity .15s ease; }
    button:hover { background:#182a5c; }
    button[disabled] { opacity:.45; cursor:not-allowed; filter: grayscale(60%); }
    .pill { padding:.25rem .6rem; border-radius:999px; font-size:.8rem; border:1px solid #2b3b71; color:#cfe0ff; }
    .ok { color: var(--good); }
    .err { color: var(--bad); }
    .muted { color: var(--muted); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

    /* layout */
    .layout { display:grid; grid-template-rows: auto auto 1fr auto; gap: 1rem; padding: 1rem; }
    .control-rail { display: grid; gap: 1rem; grid-template-columns: 1fr 1fr; }
    @media (max-width: 900px) { .control-rail { grid-template-columns: 1fr; } }

    /* table */
    .table-wrap { position: relative; width: min(1200px, 96vw); height: min(720px, 75vh); margin: 0 auto; }
    .felt { position: absolute; inset: 0; margin: auto; background: radial-gradient(ellipse at center, #0f3b1e 0%, #0b2816 55%, #081b10 100%); border: 10px solid #3a240f; border-radius: 999px; box-shadow: 0 20px 60px rgba(0,0,0,.35) inset, 0 8px 40px rgba(0,0,0,.35); }
    .board { position: absolute; left: 50%; top: 43%; transform: translate(-50%, -50%); display:flex; gap:.5rem; align-items:center; padding:.6rem .8rem; border-radius:12px; background: rgba(0,0,0,.25); border:1px solid #1f2a4d; z-index: 3; }

    /* seats */
    .seat { position: absolute; transform: translate(-50%, -50%); width: 156px; max-width: 38vw; display:flex; flex-direction:column; align-items:center; gap:.3rem;
            padding:.4rem .55rem; border-radius:12px; background: rgba(10,20,40,.55); border:1px solid #223062; box-shadow: 0 4px 16px rgba(0,0,0,.25); text-align:center; z-index: 1; }
    .seat .meta { font-size:.78rem; color: var(--muted); }
    .seat .chips { font-weight:600; font-size:.95rem; }
    .seat .bet { font-size:.9rem; color:#d5e4ff; opacity:.9; }
    .seat .badge { font-size:.72rem; padding:.12rem .4rem; border-radius:999px; border:1px solid #2b3b71; }
    .acting { outline: 2px solid var(--accent); box-shadow: 0 0 0 4px rgba(77,163,255,.25); }
    .sittingout { opacity:.6; }

    /* cards */
    .cardimg { width: 48px; height: 66px; object-fit: contain; background:#0a1433; border:1px solid #2b3b71; border-radius:8px; }
    @media (max-width: 520px) { .cardimg { width: 42px; height: 58px; } }

    /* HUD & showdown */
    .hud { position:absolute; left:50%; top: 16%; transform: translateX(-50%); display:flex; gap:1rem; align-items:center; justify-content:center; background: rgba(10,20,40,.55); border:1px solid #223062; border-radius:999px; padding:.45rem .8rem; font-size:.95rem; z-index: 2; }
    .showdown { position:absolute; left:50%; top: 7%; transform: translateX(-50%); background: rgba(20, 34, 70, .75); border:1px solid #315; color:#e9efff; border-radius: 10px; padding: .45rem .7rem; font-weight: 600; text-align: center; box-shadow: 0 6px 22px rgba(0,0,0,.35); max-width: 92%; z-index: 2; }

    /* NEW: showdown list directly under the board */
    .showdown-list {
      position:absolute; left:50%;
      top: calc(43% + 90px); /* board is centered at 43% height; drop ~90px below it */
      transform: translateX(-50%);
      display:flex; gap:.85rem; flex-wrap:wrap; justify-content:center;
      background: rgba(10,20,40,.55); border:1px solid #223062; border-radius:12px; padding:.5rem .7rem; max-width: 92%; z-index: 2;
    }
    .showdown-list .entry { display:flex; align-items:center; gap:.45rem; }
    .showdown-list .who { font-size:.9rem; color:#cfe0ff; margin-right:.15rem; }
    .showdown-list .cards { display:flex; gap:.35rem; }

    /* my hand & actions */
    .myhand { position: relative; width: min(700px, 94vw); margin: 0.25rem auto 0; text-align:center; }
    .myhand .cards { display:flex; gap:.5rem; justify-content:center; align-items:center; }
    .myhand .label { margin-top:.35rem; font-size:.95rem; color: var(--muted); }
    .actions { margin-top: .6rem; display: inline-flex; gap: .8rem; align-items: flex-start; justify-content: center; flex-wrap: wrap; background: rgba(10,20,40,.55); border: 1px solid #223062; border-radius: 12px; padding: .55rem .6rem; }
    .actions button, .actions input { font: inherit; padding: .55rem .7rem; border-radius: 10px; border: 1px solid #243158; background: #0e1530; color: #e9efff; }
    .raise-group { display:flex; flex-direction:column; gap:.35rem; align-items:center; }
    #raiseAmt { width: 8rem; text-align:center; }
    #raiseAmt[disabled] { opacity:.45; filter: grayscale(60%); }
    @media (max-width: 520px) { .actions { gap: .5rem; } #raiseAmt { width: 6.5rem; } }
  </style>
</head>
<body>
  <header>
    <div class="row">
      <strong>Poker Table</strong>
      <span id="status" class="pill muted">disconnected</span>
    </div>
    <div class="row">
      <span id="who" class="muted"></span>
      <button id="logoutBtn" title="Log out">Log out</button>
    </div>
  </header>

  <main class="layout">
    <section class="control-rail">
      <div class="card">
        <h3 style="margin-top:0">Controls</h3>
        <div class="row">
          <label for="room">Room</label>
          <select id="room">
            <option value="1">Room 1</option>
            <option value="2">Room 2</option>
          </select>
          <label for="stack">Stack</label>
          <input id="stack" type="number" step="0.01" min="0" value="100" />
          <button id="joinBtn">Join</button>
          <button id="leaveBtn">Leave</button>
          <button id="sitToggleBtn" title="Toggle sit in/out">Sit In / Out</button>
        </div>
        <div id="msg" style="margin-top:.6rem;"></div>
      </div>
      <div class="card">
        <h3 style="margin-top:0">Tips</h3>
        <div class="muted" style="font-size:.95rem">
          Buttons are automatically enabled/disabled based on the table state.
        </div>
      </div>
    </section>

    <section class="table-wrap">
      <div class="felt" aria-hidden="true"></div>

      <!-- showdown -->
      <div id="showdownBanner" class="showdown" style="display:none"></div>
      <div id="showdownList" class="showdown-list" style="display:none"></div>

      <div class="hud">
        <div>Room: <span id="roomId">—</span></div>
        <div>• Pot: <span id="pot">—</span></div>
        <div>• Current Bet: <span id="currentBet">—</span></div>
        <div>• To Act: <span id="toAct">—</span></div>
      </div>

      <div id="board" class="board"></div>
      <div id="seatsLayer"></div>
    </section>

    <section class="myhand">
      <div class="cards" id="myHand"></div>
      <div class="actions">
        <button id="checkBtn">Check</button>
        <button id="callBtn">Call</button>
        <div class="raise-group">
          <button id="raiseBtn" title="Raise by this amount">raise by:</button>
          <input id="raiseAmt" type="number" step="0.01" min="0" value="1" />
          <button id="minBtn" title="Fill minimum raise">Min</button>
        </div>
        <button id="foldBtn">Fold</button>
    </section>
  </main>

  <script>
    // ---------- tiny helpers ----------
    const $ = (id) => document.getElementById(id);
    const statusEl = $('status'), msgEl = $('msg'), whoEl = $('who');

    function showMsg(text, type = '') {
      msgEl.className = type ? type : '';
      msgEl.textContent = text;
    }

    async function loadMe() {
      try {
        const res = await fetch('/me', { credentials: 'include' });
        if (res.status === 401) { location.href = '/login'; return; }
        if (!res.ok) return;
        const me = await res.json();
        whoEl.textContent = me.username ? `Signed in as ${me.username}` : '';
      } catch {}
    }

    // ---------- showdown helpers ----------
    function getShowdownHands(st) {
      const hands = st?.showDownHands ?? st?.ShowDownHands ?? st?.showdownHands ?? st?.hand?.showDownHands ?? st?.hand?.showdownHands ?? [];
      return (hands || []).filter(h => {
        const cards = h?.Hand ?? h?.hand;
        return Array.isArray(cards) && cards.length > 0;
      });
    }

    function getShowdownMessage(st) {
      const hand = st?.hand ?? st?.Hand;
      const raw = hand?.showDownMessage ?? hand?.ShowDownMessage ?? st?.showDownMessage ?? st?.ShowDownMessage ?? st?.showdownMessage ?? '';
      return String(raw || '').trim();
    }

    // ---------- card utils ----------
    function suitName(s) {
      const ch = (s || '').toString().toUpperCase();
      if (ch === 'S') return 'SPADE';
      if (ch === 'H') return 'HEART';
      if (ch === 'D') return 'DIAMOND';
      if (ch === 'C') return 'CLUB';
      return '';
    }
    function rankToken(r) {
      const n = Number(r);
      if (Number.isFinite(n)) {
        if (n >= 2 && n <= 10) return String(n);
        if (n === 11) return '11-JACK';
        if (n === 12) return '12-QUEEN';
        if (n === 13) return '13-KING';
        if (n === 14 || n === 1) return '1-ACE';
      }
      const up = String(r || '').toUpperCase();
      if (up === 'A') return '1-ACE';
      if (up === 'K') return '13-KING';
      if (up === 'Q') return '12-QUEEN';
      if (up === 'J') return '11-JACK';
      return '';
    }
    function parseCard(card) {
      if (typeof card === 'string') {
        const suit = card.slice(-1);
        const rank = card.slice(0, -1);
        return { rank, suit };
      }
      return { rank: card?.rank ?? card?.Rank ?? '', suit: card?.suit ?? card?.Suit ?? '' };
    }
    function cardImageURL(card) {
      const { rank, suit } = parseCard(card);
      const s = suitName(suit), rt = rankToken(rank);
      if (!s || !rt) return null;
      return `/static/card_svgs/${s}-${rt}.svg`;
    }
    function renderCardImg(card) {
      const url = cardImageURL(card);
      const img = document.createElement('img');
      img.className = 'cardimg';
      if (url) { img.src = url; img.alt = url.split('/').pop(); }
      else { img.alt = '??'; img.title = JSON.stringify(card); }
      return img;
    }

    // ---------- API ----------
    const api = {
      async join(room, stack) {
        const res = await fetch(`/join?room=${encodeURIComponent(room)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ stack: Number(stack) || 0 })
        });
        if (res.status === 401) location.href = '/login';
        if (!res.ok) throw new Error((await res.text()) || 'join failed');
      },
      async leave(room) {
        const res = await fetch(`/leave?room=${encodeURIComponent(room)}`, {
          method: 'POST', credentials: 'include'
        });
        if (res.status === 401) location.href = '/login';
        if (!res.ok) throw new Error((await res.text()) || 'leave failed');
      },
      async state(room) {
        const res = await fetch(`/state?room=${encodeURIComponent(room)}`, {
          method: 'GET', credentials: 'include'
        });
        if (res.status === 401) location.href = '/login';
        if (!res.ok) throw new Error((await res.text()) || 'state failed');
        const text = await res.text();
        if (!text || text.trim() === '' || text.trim() === 'null') return null;
        try { return JSON.parse(text); } catch { return null; }
      },
      async action(room, action, amount = 0) {
        const res = await fetch(`/action?room=${encodeURIComponent(room)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ action, amount: Number(amount) || 0 })
        });
        if (res.status === 401) location.href = '/login';
        if (!res.ok) throw new Error((await res.text()) || 'action failed');
      },
      async sit(room, sitIn) {
        const res = await fetch(`/sitInOrOut?room=${encodeURIComponent(room)}&sitIn=${sitIn}`, {
          method: 'POST', credentials: 'include'
        });
        if (res.status === 401) location.href = '/login';
        if (!res.ok) throw new Error((await res.text()) || 'sit toggle failed');
      },
      async logout() { location.href = '/login'; }
    };

    // ---------- UI wiring ----------
    const roomSel = $('room'), stackInp = $('stack'), joinBtn = $('joinBtn'), leaveBtn = $('leaveBtn'), sitBtn = $('sitToggleBtn');
    const checkBtn = $('checkBtn'), callBtn = $('callBtn'), raiseBtn = $('raiseBtn'), raiseAmt = $('raiseAmt'), minBtn = $('minBtn'), foldBtn = $('foldBtn');
    const roomIdEl = $('roomId'), potEl = $('pot'), currentBetEl = $('currentBet'), toActEl = $('toAct');
    const boardEl = $('board'), seatsLayer = $('seatsLayer'), myHandEl = $('myHand');
    const actionsBar = document.querySelector('.myhand .actions');
    const showdownBanner = $('showdownBanner'), showdownList = $('showdownList');

    $('logoutBtn').addEventListener('click', api.logout);

    joinBtn.addEventListener('click', async () => {
      const room = roomSel.value, stack = stackInp.value;
      try {
        await api.join(room, stack);
        showMsg(`Joined room ${room}`, 'ok');
        pollState.now();
      } catch (e) { showMsg(e.message || 'join failed', 'err'); }
    });

    leaveBtn.addEventListener('click', async () => {
      const room = roomSel.value;
      try {
        await api.leave(room);
        showMsg(`Left room ${room}`, 'ok');
        renderState(null);
      } catch (e) { showMsg(e.message || 'leave failed', 'err'); }
    });

    sitBtn.addEventListener('click', async () => {
      const room = roomSel.value;
      try {
        await api.sit(room, true);
        showMsg('Sat in', 'ok');
      } catch {
        try {
          await api.sit(room, false);
          showMsg('Sat out', 'ok');
        } catch (e2) { showMsg(e2.message || 'sit toggle failed', 'err'); }
      }
      pollState.soon();
    });

    checkBtn.addEventListener('click', async () => doAction('check'));
    callBtn.addEventListener('click', async () => doAction('call'));
    raiseBtn.addEventListener('click', async () => doAction('raise', raiseAmt.value));
    foldBtn.addEventListener('click', async () => doAction('fold'));

    // quick-fill the minimum raise suggestion
    minBtn.addEventListener('click', () => {
      if (typeof minBtn.dataset.minAdd !== 'undefined') {
        raiseAmt.value = minBtn.dataset.minAdd;
      }
    });

    async function doAction(act, amt = 0) {
      const room = roomSel.value;
      try {
        await api.action(room, act, amt);
        showMsg(`Action: ${act}${act==='raise' ? ' ' + (Number(amt)||0) : ''}`, 'ok');
        pollState.soon();
      } catch (e) { showMsg(e.message || 'action failed', 'err'); }
    }

    // ---------- enable/disable helpers ----------
    function setEnabled(el, enabled) {
      if (!el) return;
      el.disabled = !enabled;
      el.setAttribute('aria-disabled', String(!enabled));
      if (!enabled) el.title = 'Not available right now'; else el.removeAttribute('title');
    }
    function getAvailableActionsFromHand(hand) {
      let raw = hand?.availableActions ?? hand?.AvailableActions ?? hand?.avaliableActions ?? hand?.AvaliableActions ?? [];
      if (typeof raw === 'string') raw = raw.split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
      else if (Array.isArray(raw)) raw = raw.map(x => String(x).trim().toLowerCase());
      else raw = [];
      return raw;
    }
    function enableActionsFrom(avail) {
      const a = Array.isArray(avail) ? avail.map(x => String(x).toLowerCase()) : [];
      const has = (k) => a.includes(k);
      setEnabled(checkBtn, has('check'));
      setEnabled(callBtn, has('call'));
      setEnabled(raiseBtn, has('raise'));
      setEnabled(foldBtn, has('fold'));
      setEnabled(raiseAmt, has('raise'));
      setEnabled(minBtn, has('raise'));
    }

    // ---------- polling ----------
    const pollState = (() => {
      let timer = null;
      async function tick() {
        const room = roomSel.value;
        statusEl.textContent = 'updating…';
        try {
          const st = await api.state(room);
          renderState(st);
          statusEl.textContent = 'connected';
          statusEl.className = 'pill';
        } catch (e) {
          statusEl.textContent = 'error';
          statusEl.className = 'pill err';
          if (e && /401|auth/i.test(String(e))) location.href = '/login';
        } finally {
          timer = setTimeout(tick, 1000);
        }
      }
      function start() { if (!timer) timer = setTimeout(tick, 80); }
      function stop() { if (timer) { clearTimeout(timer); timer = null; } }
      function now() { stop(); start(); }
      function soon() { stop(); timer = setTimeout(tick, 300); }
      document.addEventListener('visibilitychange', () => { if (document.hidden) stop(); else now(); });
      start();
      return { start, stop, now, soon };
    })();

    // ---------- geometry + utils ----------
    function computeSeatPositions(n) {
      const pts = [], cx = 50, cy = 50, rx = 44, ry = 36;
      for (let i = 0; i < n; i++) {
        const theta = (Math.PI/2) - (i * (2*Math.PI / n));
        pts.push({ x: cx + rx * Math.cos(theta), y: cy + ry * Math.sin(theta) });
      }
      return pts;
    }
    function escapeHtml(s){
      return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
    }
    function fmtMoney(v){
      const n = Number(v);
      return Number.isFinite(n) ? n.toFixed(2) : (v ?? '');
    }
    function computeMinRaiseAdd(hand, me) {
      let v = Number(hand?.raiseAmount ?? hand?.RaiseAmount ?? 0);
      if (!Number.isFinite(v) || v <= 0) {
        const tableBet = Number(hand?.currentBet ?? hand?.CurrentBet ?? 0);
        const myBet = Number(me?.currentBet ?? me?.CurrentBet ?? 0);
        v = tableBet - myBet;
      }
      if (!Number.isFinite(v) || v <= 0) v = 1;
      return v;
    }

    // ---------- rendering ----------
    function renderState(st) {
      if (!st || (Object.keys(st).length === 0)) {
        roomIdEl.textContent = '—';
        potEl.textContent = '—';
        currentBetEl.textContent = '—';
        toActEl.textContent = '—';
        boardEl.innerHTML = '';
        seatsLayer.innerHTML = '';
        myHandEl.innerHTML = '';
        if (actionsBar) actionsBar.style.display = 'none';
        showdownBanner.style.display = 'none';
        showdownList.style.display = 'none';
        enableActionsFrom([]);
        return;
      }

      const hand = st.hand || st.Hand || null;
      roomIdEl.textContent = st.room ?? st.Room ?? '—';
      potEl.textContent = fmtMoney(hand?.pot ?? hand?.Pot ?? '');
      currentBetEl.textContent = fmtMoney(hand?.currentBet ?? hand?.CurrentBet ?? '');
      toActEl.textContent = hand?.actionPlayerName ?? hand?.ActionPlayerName ?? '—';

      const sdMsg = getShowdownMessage(st);
      const sdHands = getShowdownHands(st);
      const street = String(hand?.street ?? st?.street ?? st?.Street ?? '').toLowerCase();
      const hasShowdown = (street === 'showdown') && (sdMsg.length > 0 || (Array.isArray(sdHands) && sdHands.length > 0));

      showdownBanner.style.display = hasShowdown ? 'block' : 'none';
      showdownBanner.textContent = hasShowdown ? (sdMsg || 'Showdown') : '';

      const board = hand?.board ?? hand?.Board ?? [];
      boardEl.innerHTML = '';
      (board || []).forEach(card => boardEl.appendChild(renderCardImg(card)));

      const rawPlayers = (st.players || st.Players || []).slice();

      // id<->name maps for display names
      const idByName = new Map();
      const nameById = new Map();
      rawPlayers.forEach(p => {
        const id = String(p.id ?? p.ID ?? p.playerId ?? p.PlayerID ?? '').trim();
        const name = String(p.name ?? p.Name ?? '').trim();
        if (id) nameById.set(id, name);
        if (name) idByName.set(name, id);
      });

      // rotate so the player with a hand sits at bottom
      const myIndex = rawPlayers.findIndex(p => Array.isArray(p.hand ?? p.Hand) && ((p.hand?.length || 0) > 0 || (p.Hand?.length || 0) > 0));
      let players = rawPlayers;
      if (myIndex >= 0) players = [...rawPlayers.slice(myIndex), ...rawPlayers.slice(0, myIndex)];

      const positions = computeSeatPositions(Math.max(players.length, Math.min(9, Math.max(players.length, 6))));
      seatsLayer.innerHTML = '';

      // build seats (smaller footprint)
      players.forEach((p, i) => {
        const id = String(p.id ?? p.ID ?? p.playerId ?? p.PlayerID ?? '').trim();
        const name = String(p.name ?? p.Name ?? '').trim();
        const stack = p.stack ?? p.Stack ?? '';
        const bet = p.currentBet ?? p.CurrentBet ?? '';
        const sittingOut = (p.sittingOut ?? p.SittingOut) ? true : false;
        const isActing = (toActEl.textContent && (name === toActEl.textContent));
        const pos = positions[i];

        const seat = document.createElement('div');
        seat.className = 'seat' + (isActing ? ' acting' : '') + (sittingOut ? ' sittingout' : '');
        seat.style.left = pos.x + '%';
        seat.style.top = pos.y + '%';

        const title = document.createElement('div');
        title.innerHTML = `<strong>${escapeHtml(name || '(player)')}</strong>`;
        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = name ? '' : (id || '');
        const chips = document.createElement('div');
        chips.className = 'chips';
        chips.textContent = `${fmtMoney(stack)}`;
        const betEl = document.createElement('div');
        betEl.className = 'bet';
        betEl.textContent = bet ? `Bet: ${fmtMoney(bet)}` : '';
        const badge = document.createElement('div');
        badge.className = 'badge';
        badge.textContent = sittingOut ? 'Sitting out' : 'Active';

        seat.appendChild(title);
        if (!name) seat.appendChild(meta); // hide pid if we have a name
        seat.appendChild(chips);
        if (bet) seat.appendChild(betEl);
        seat.appendChild(badge);

        seatsLayer.appendChild(seat);
      });

      // showdown list (directly under the board, uses display names)
      if (hasShowdown) {
        showdownList.innerHTML = '';
        (sdHands || []).forEach(hh => {
          const cards = hh.Hand ?? hh.hand ?? null;
          if (!Array.isArray(cards) || cards.length === 0) return;
          const pid = String(hh.PlayerName ?? hh.playerName ?? '').trim();
          const displayName = nameById.get(pid) || pid || 'player';
          const entry = document.createElement('div');
          entry.className = 'entry';
          const label = document.createElement('div');
          label.className = 'who';
          label.textContent = displayName;
          const cardsWrap = document.createElement('div');
          cardsWrap.className = 'cards';
          cards.forEach(c => cardsWrap.appendChild(renderCardImg(c)));
          entry.appendChild(label);
          entry.appendChild(cardsWrap);
          showdownList.appendChild(entry);
        });
        showdownList.style.display = showdownList.children.length ? 'flex' : 'none';
      } else {
        showdownList.style.display = 'none';
        showdownList.innerHTML = '';
      }

      // my hand dock
      myHandEl.innerHTML = '';
      const me = rawPlayers[myIndex];
      const myCards = me ? (me.hand ?? me.Hand ?? []) : [];
      if (Array.isArray(myCards) && myCards.length) {
        myCards.forEach(c => myHandEl.appendChild(renderCardImg(c)));
        if (actionsBar) actionsBar.style.display = 'inline-flex';
      } else {
        if (actionsBar) actionsBar.style.display = 'none';
      }

      // min-raise suggestion & quick-fill
      const minAdd = computeMinRaiseAdd(hand, me);
      raiseAmt.placeholder = fmtMoney(minAdd);
      raiseAmt.step = String(minAdd);
      raiseAmt.min = String(minAdd);
      minBtn.textContent = `Min (+${fmtMoney(minAdd)})`;
      minBtn.dataset.minAdd = String(minAdd);
      raiseBtn.title = `Minimum raise add: ${fmtMoney(minAdd)}`;

      // enable/disable buttons
      const avail = (hand ? getAvailableActionsFromHand(hand) : []);
      enableActionsFrom(avail);
    }

    // ---------- kickoff ----------
    (async () => {
      await loadMe();
      try {
        const st = await api.state(roomSel.value);
        renderState(st);
      } catch (e) {
        if (e && /401/.test(String(e))) location.href = '/login';
      }
    })();
  </script>
</body>
</html>
