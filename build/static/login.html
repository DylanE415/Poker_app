<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Poker Login</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root{
      --blue:#3b82f6;   /* accent */
      --blue-d:#1e40af; /* darker */
      --bg:#0b1020;     /* fallback */
      --text:#e9efff;
      --muted:#aab3cc;
      --border:rgba(255,255,255,.12);
      --shadow:0 12px 30px rgba(0,0,0,.35);
      --radius:14px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color:var(--text);
      min-height:100vh;
      display:grid; place-items:center;
      background:
        radial-gradient(800px 600px at 20% -10%, rgba(59,130,246,.25), transparent 60%),
        radial-gradient(700px 500px at 120% 20%, rgba(30,64,175,.25), transparent 60%),
        linear-gradient(180deg, #0f1d46, #0b1535);
      padding:1.25rem;
    }
    .card{
      width:100%; max-width:360px;
      background:linear-gradient(180deg, #111a3b, #0e1734);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:1.25rem;
      display:grid; gap:1rem;
    }
    h1{margin:0; font-size:1.25rem; font-weight:700; letter-spacing:.2px}
    form{display:grid; gap:.8rem}
    label{font-size:.9rem; color:var(--muted); display:grid; gap:.4rem}
    input,button{font-size:1rem}
    input{
      padding:.75rem .85rem;
      border-radius:10px;
      border:1px solid var(--border);
      background:#0e1730;
      color:var(--text);
      outline:none;
      transition:border-color .15s, box-shadow .15s;
    }
    input:focus{
      border-color:var(--blue);
      box-shadow:0 0 0 3px rgba(59,130,246,.18);
    }
    button{
      padding:.8rem .9rem;
      border-radius:10px;
      border:1px solid rgba(59,130,246,.45);
      background:linear-gradient(180deg, var(--blue), #4f8efc);
      color:#041225;
      font-weight:700;
      cursor:pointer;
      box-shadow:0 8px 22px rgba(59,130,246,.28);
      transition:filter .15s, transform .06s;
    }
    button:hover{filter:brightness(1.05)}
    button:active{transform:translateY(1px)}
    button:disabled{opacity:.6; cursor:not-allowed}
    .msg{min-height:1.1rem; font-size:.95rem}
    .msg.ok{color:#3ecf8e}
    .msg.error{color:#f25f5c}
  </style>
</head>
<body>
  <div class="card">
    <h1>Login</h1>
    <div id="msg" class="msg" role="status" aria-live="polite"></div>

    <form id="f" novalidate>
      <label>
        Username
        <input name="username" autocomplete="username" required />
      </label>
      <label>
        Password
        <input name="password" type="password" autocomplete="current-password" required />
      </label>
      <button id="submit" type="submit">Sign in</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('f');
    const msg = document.getElementById('msg');
    const submitBtn = document.getElementById('submit');

    function show(type, text){
      msg.className = 'msg ' + (type||'');
      msg.textContent = text || '';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      show('', '');
      submitBtn.disabled = true;

      const payload = {
        username: form.username.value.trim(),
        password: form.password.value
      };

      try {
        const res = await fetch('/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(payload),
          credentials: 'include'
        });

        if (res.ok) {
          show('ok', 'Logged in! Redirecting…');
          window.location.href = '/play';
        } else {
          const text = await res.text();
          show('error', text || 'Invalid credentials');
        }
      } catch {
        show('error', 'Network error');
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
