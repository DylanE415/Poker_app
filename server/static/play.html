<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Poker — Table</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root { --bg:#0b1020; --panel:#121a33; --muted:#aab3cc; --accent:#4da3ff; --bad:#f25f5c; --good:#3ecf8e; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: #e9efff;}
    header { display:flex; align-items:center; justify-content:space-between; padding:1rem 1.25rem; border-bottom: 1px solid #1f2a4d; }
    .row { display:flex; gap:1rem; align-items:center; flex-wrap:wrap; }
    .card { background: var(--panel); border:1px solid #1f2a4d; border-radius:14px; padding:1rem; }
    .grid { display:grid; gap:1rem; grid-template-columns: 1fr 1fr; padding:1rem; }
    @media (max-width: 920px) { .grid { grid-template-columns: 1fr; } }
    label { font-size:.9rem; color: var(--muted); }
    select, input, button { font: inherit; padding:.55rem .7rem; border-radius:10px; border:1px solid #243158; background:#0e1530; color:#e9efff; }
    button { background:#13214a; cursor:pointer; border-color:#2b3b71; }
    button:hover { background:#182a5c; }
    button[disabled] { opacity:.5; cursor:not-allowed; }
    .pill { padding:.25rem .6rem; border-radius:999px; font-size:.8rem; border:1px solid #2b3b71; color:#cfe0ff; }
    .ok { color: var(--good); }
    .err { color: var(--bad); }
    table { width:100%; border-collapse: collapse; }
    th, td { text-align:left; padding:.4rem .5rem; border-bottom: 1px solid #223062; font-size:.95rem; }
    .actions button { margin-right:.4rem; margin-bottom:.4rem; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .muted { color: var(--muted); }
    .board { display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; }
    .cardface { background:#0a1433; border:1px solid #2b3b71; padding:.45rem .55rem; border-radius:8px; min-width:2.2rem; text-align:center; }
    .statusline { font-size:.95rem; }
  </style>
</head>
<body>
  <header>
    <div class="row">
      <strong>Poker Table</strong>
      <span id="status" class="pill muted">disconnected</span>
    </div>
    <div class="row">
      <button id="logoutBtn" title="Log out">Log out</button>
    </div>
  </header>

  <section class="grid">
    <!-- Controls -->
    <div class="card">
      <h3 style="margin-top:0">Controls</h3>
      <div class="row">
        <label for="room">Room</label>
        <select id="room">
          <option value="1">Room 1</option>
          <option value="2">Room 2</option>
        </select>

        <label for="stack">Stack</label>
        <input id="stack" type="number" step="0.01" min="0" value="100" />
        <button id="joinBtn">Join</button>
        <button id="leaveBtn">Leave</button>
        <button id="sitToggleBtn" title="Toggle sit in/out">Sit In / Out</button>
      </div>
      <div id="msg" style="margin-top:.6rem;"></div>
    </div>

    <!-- Actions -->
    <div class="card">
      <h3 style="margin-top:0">Actions</h3>
      <div class="actions">
        <button id="checkBtn">Check</button>
        <button id="callBtn">Call</button>
        <input id="raiseAmt" type="number" step="0.01" min="0" value="1" style="width:7rem" />
        <button id="raiseBtn">Raise</button>
        <button id="foldBtn">Fold</button>
      </div>
      <div class="muted" style="margin-top:.5rem; font-size:.9rem">
        Buttons auto-enable based on <code>availableActions</code> from <span class="mono">/state</span>.
      </div>
    </div>

    <!-- Table State -->
    <div class="card">
      <h3 style="margin-top:0">Table</h3>
      <div class="statusline">
        <div>Room: <span id="roomId">—</span></div>
        <div>Pot: <span id="pot">—</span> • Current Bet: <span id="currentBet">—</span></div>
        <div>To Act: <span id="toAct">—</span></div>
      </div>
      <div style="margin-top:.6rem;">
        <div class="muted" style="margin-bottom:.3rem">Board</div>
        <div id="board" class="board"></div>
      </div>
    </div>

    <!-- Players -->
    <div class="card">
      <h3 style="margin-top:0">Players</h3>
      <table>
        <thead>
          <tr>
            <th>Name</th><th class="mono">ID</th><th>Stack</th><th>Bet</th><th>Status</th><th>Your hand</th>
          </tr>
        </thead>
        <tbody id="playersTbody"></tbody>
      </table>
    </div>
  </section>

  <script>
    // ---- helpers ----
    const $ = (id) => document.getElementById(id);
    const statusEl = $('status');
    const msgEl = $('msg');

    function showMsg(text, type='') {
      msgEl.className = type ? type : '';
      msgEl.textContent = text;
    }

    const api = {
      async join(room, stack) {
        const res = await fetch(`/join?room=${encodeURIComponent(room)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ stack: Number(stack) || 0 })
        });
        if (res.status === 401) location.href = '/login';
        if (!res.ok) throw new Error(await res.text() || 'join failed');
      },
      async leave(room) {
        const res = await fetch(`/leave?room=${encodeURIComponent(room)}`, {
          method: 'POST',
          credentials: 'include'
        });
        if (res.status === 401) location.href = '/login';
        if (!res.ok) throw new Error(await res.text() || 'leave failed');
      },
      async state(room) {
        const res = await fetch(`/state?room=${encodeURIComponent(room)}`, {
          method: 'GET',
          credentials: 'include'
        });
        if (res.status === 401) location.href = '/login';
        if (!res.ok) throw new Error(await res.text() || 'state failed');
        return res.json(); // expects the JSON your getStateHandler encodes
      },
      async action(room, action, amount=0) {
        const res = await fetch(`/action?room=${encodeURIComponent(room)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ action, amount: Number(amount) || 0 })
        });
        if (res.status === 401) location.href = '/login';
        if (!res.ok) throw new Error(await res.text() || 'action failed');
      },
      async sit(room, sitIn) {
        const res = await fetch(`/sitInOrOut?room=${encodeURIComponent(room)}&sitIn=${sitIn}`, {
          method: 'POST',
          credentials: 'include'
        });
        if (res.status === 401) location.href = '/login';
        if (!res.ok) throw new Error(await res.text() || 'sit toggle failed');
      },
      async logout() {
        // you don't have a /logout handler in the snippet; if you add one, call it here.
        // As a fallback, redirect to login; server will treat you as logged out when cookie expires.
        location.href = '/login';
      }
    };

    // ---- UI wiring ----
    const roomSel  = $('room');
    const stackInp = $('stack');
    const joinBtn  = $('joinBtn');
    const leaveBtn = $('leaveBtn');
    const sitBtn   = $('sitToggleBtn');

    const checkBtn = $('checkBtn');
    const callBtn  = $('callBtn');
    const raiseBtn = $('raiseBtn');
    const raiseAmt = $('raiseAmt');
    const foldBtn  = $('foldBtn');

    const roomIdEl   = $('roomId');
    const potEl      = $('pot');
    const currentBetEl = $('currentBet');
    const toActEl    = $('toAct');
    const boardEl    = $('board');
    const playersTbody = $('playersTbody');

    $('logoutBtn').addEventListener('click', api.logout);

    joinBtn.addEventListener('click', async () => {
      const room = roomSel.value;
      const stack = stackInp.value;
      try {
        await api.join(room, stack);
        showMsg(`Joined room ${room}`, 'ok');
        pollState.now();
      } catch (e) { showMsg(e.message || 'join failed', 'err'); }
    });

    leaveBtn.addEventListener('click', async () => {
      const room = roomSel.value;
      try {
        await api.leave(room);
        showMsg(`Left room ${room}`, 'ok');
        // Clear table UI a bit
        renderState({});
      } catch (e) { showMsg(e.message || 'leave failed', 'err'); }
    });

    sitBtn.addEventListener('click', async () => {
      const room = roomSel.value;
      // naive toggle: try sitIn=true first, if server says already in that state you could flip
      try {
        await api.sit(room, true);
        showMsg('Sat in', 'ok');
      } catch {
        try {
          await api.sit(room, false);
          showMsg('Sat out', 'ok');
        } catch (e2) {
          showMsg(e2.message || 'sit toggle failed', 'err');
        }
      }
      pollState.soon();
    });

    checkBtn.addEventListener('click', async () => doAction('check'));
    callBtn.addEventListener('click', async () => doAction('call'));
    raiseBtn.addEventListener('click', async () => doAction('raise', raiseAmt.value));
    foldBtn.addEventListener('click', async () => doAction('fold'));

    async function doAction(act, amt=0) {
      const room = roomSel.value;
      try {
        await api.action(room, act, amt);
        showMsg(`Action: ${act}${act==='raise' ? ' ' + (Number(amt)||0) : ''}`, 'ok');
        pollState.soon();
      } catch (e) {
        showMsg(e.message || 'action failed', 'err');
      }
    }

    // ---- polling ----
    const pollState = (() => {
      let timer = null;
      let inflight = null;

      async function tick() {
        const room = roomSel.value;
        statusEl.textContent = 'updating…';
        try {
          inflight = api.state(room);
          const st = await inflight;
          renderState(st);
          statusEl.textContent = 'connected';
          statusEl.className = 'pill';
        } catch (e) {
          statusEl.textContent = 'error';
          statusEl.className = 'pill err';
          if (e && /401|auth/i.test(String(e))) location.href = '/login';
        } finally {
          inflight = null;
          timer = setTimeout(tick, 1000);
        }
      }
      function start() {
        if (!timer) timer = setTimeout(tick, 50);
      }
      function stop() {
        if (timer) { clearTimeout(timer); timer = null; }
      }
      function now() { stop(); start(); }
      function soon() { stop(); timer = setTimeout(tick, 300); }
      start();
      return { start, stop, now, soon };
    })();

    // ---- rendering ----
    function renderState(st) {
      // Expecting something like:
      // { room:int, actionPlayerIndex:int, players:[{id,name,stack,sittingOut,currentBet,hand?}], hand: {board:[], pot, currentBet, availableActions[], actionPlayerName, raiseAmount} }
      // Be defensive in case fields are missing or differently cased.
      const roomId = st.room ?? st.Room ?? '—';
      roomIdEl.textContent = roomId;

      const hand = st.hand || st.Hand || null;
      potEl.textContent = hand?.pot ?? hand?.Pot ?? '—';
      currentBetEl.textContent = hand?.currentBet ?? hand?.CurrentBet ?? '—';
      toActEl.textContent = hand?.actionPlayerName ?? hand?.ActionPlayerName ?? '—';

      const board = hand?.board ?? hand?.Board ?? [];
      boardEl.innerHTML = '';
      (board || []).forEach(card => {
        const face = document.createElement('div');
        face.className = 'cardface mono';
        // Show as "RankSuit" or JSON if unknown
        if (typeof card === 'string') {
          face.textContent = card;
        } else if (card && (card.rank || card.suit)) {
          face.textContent = `${card.rank ?? card.Rank ?? '?'}${card.suit ?? card.Suit ?? ''}`;
        } else {
          face.textContent = JSON.stringify(card);
        }
        boardEl.appendChild(face);
      });

      // Players table
      const players = st.players || st.Players || [];
      playersTbody.innerHTML = '';
      players.forEach(p => {
        const tr = document.createElement('tr');
        const id   = p.id ?? p.ID ?? '';
        const name = p.name ?? p.Name ?? '';
        const stack = p.stack ?? p.Stack ?? '';
        const bet = p.currentBet ?? p.CurrentBet ?? '';
        const sitting = (p.sittingOut ?? p.SittingOut) ? 'Sitting out' : 'Active';
        const handArr = p.hand ?? p.Hand ?? null;

        tr.innerHTML = `
          <td>${escapeHtml(name)}</td>
          <td class="mono">${escapeHtml(id)}</td>
          <td>${Number(stack).toFixed ? Number(stack).toFixed(2) : stack}</td>
          <td>${Number(bet).toFixed ? Number(bet).toFixed(2) : bet}</td>
          <td>${sitting}</td>
          <td class="mono">${handArr ? renderHandText(handArr) : ''}</td>
        `;
        playersTbody.appendChild(tr);
      });

      // Enable/disable action buttons from availableActions
      const avail = (hand?.availableActions ?? hand?.AvailableActions) || [];
      enableActionsFrom(avail);
    }

    function enableActionsFrom(avail) {
      const has = (k) => avail.includes(k);
      // If server doesn’t send avail, enable all; else gate by list.
      if (!Array.isArray(avail) || avail.length === 0) {
        [checkBtn, callBtn, raiseBtn, foldBtn].forEach(b => b.disabled = false);
        return;
      }
      checkBtn.disabled = !has('check');
      callBtn.disabled  = !has('call');
      raiseBtn.disabled = !has('raise');
      foldBtn.disabled  = !has('fold');
    }

    function renderHandText(hand) {
      try {
        return (hand || []).map(c => {
          if (typeof c === 'string') return c;
          const r = c.rank ?? c.Rank ?? '?';
          const s = c.suit ?? c.Suit ?? '';
          return `${r}${s}`;
        }).join(' ');
      } catch { return ''; }
    }

    function escapeHtml(s) {
      return String(s)
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'",'&#39;');
    }

    // kick things off
    statusEl.textContent = 'connected';
    statusEl.className = 'pill';
    // First paint
    (async () => {
      try {
        const st = await api.state(roomSel.value);
        renderState(st);
      } catch (e) {
        if (e && /401/.test(String(e))) location.href = '/login';
      }
    })();
  </script>
</body>
</html>
