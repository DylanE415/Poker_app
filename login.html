<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Poker Login</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; padding: 2rem; }
    form { max-width: 320px; display: grid; gap: 0.75rem; }
    input, button { padding: 0.6rem 0.7rem; font-size: 1rem; }
    .error { color: #b00020; margin-bottom: 0.5rem; }
    .ok { color: #0a7a0a; margin-bottom: 0.5rem; }
  </style>
</head>
<body>
  <h1>Login</h1>
  <div id="msg"></div>
  <form id="f">
    <label>
      Username
      <input name="username" autocomplete="username" required />
    </label>
    <label>
      Password
      <input name="password" type="password" autocomplete="current-password" required />
    </label>
    <button type="submit">Sign in</button>
  </form>

  <script>
  const form = document.getElementById('f');
  const msg = document.getElementById('msg');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.className = '';
    msg.textContent = '';

    const payload = {
      username: form.username.value,
      password: form.password.value
    };

    try {
      const res = await fetch('/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload),
        credentials: 'include' // send/receive cookies
      });

      if (res.ok) {
        msg.className = 'ok';
        msg.textContent = 'Logged in! Redirecting...';
        // go to your game UI (change this path to whatever page you use)
        window.location.href = '/play'; // or your table page
      } else {
        const text = await res.text();
        msg.className = 'error';
        msg.textContent = text || 'Invalid credentials';
      }
    } catch (err) {
      msg.className = 'error';
      msg.textContent = 'Network error';
    }
  });
  </script>
</body>
</html>
